; GravityControl 1.1 settings. Changes apply within a second while the game runs.
; With Mod Settings Menu installed, the same settings are under Options > MODS, and a value
; changed there wins over this file.
; Keys are Windows virtual-key codes (0xA1 = Right Shift, 0xA0 = Left Shift, 0x76 = F7). 0 = no key.

[General]
; 0 = the mod does nothing.
Enabled=1
; 1 = shifting needs the Gravity Anomaly ability unlocked in the save.
RequireAnomalyUnlocked=1
; 1 = warn at start when the game version differs from the one this mod was made for.
VersionWarning=1
; 1 = extra detail in gravitycontrol.log.
Diagnostics=0

[Keys]
; Tap = shift gravity. Hold for HoldSeconds = reset.
Shift=0xA1
HoldSeconds=1.0

[Controller]
; Xbox, DualSense and DualShock 4 pads. Button mask: 0x0001 = d-pad up, 0x0002 = down,
; 0x0004 = left, 0x0008 = right, 0x0100 = LB / L1, 0x0200 = RB / R1. Tap = shift, hold = reset.
Enabled=1
Button=0x0001
HoldSeconds=1.0

[Ray]
; How far ahead and above to look for a surface, in metres.
Length=5
; Sweep thickness.
Radius=0.15

[Edge]
; With nothing ahead or above: probe past the edge in front (Ahead metres out, Depth metres down)
; and land on the surface beyond it.
Ahead=1.2
Depth=2.5
FloorTolerance=0.35
; 1 = the new up is always a world axis. 0 = exact surface normals, snapped within SnapDegrees.
AxisOnly=1
SnapDegrees=15

[Blockers]
; Experimental. Physics layers whose collision with the player is switched off (comma-separated).
; WARNING: leave empty. 14 removes the overworld ceiling but breaks the world above it.
IgnoreLayers=
